<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#03050E" />
    </linearGradient>

    <linearGradient id="borderAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#00FF9D;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00FF9D;#00F0FF;#7928CA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00F0FF;#7928CA;#00FF9D" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#00F0FF" opacity="0.15" />
    </pattern>
  </defs>

  <style>
    @keyframes barPulse {
      0%, 100% { height: 8px; y: 196px; }
      50% { height: 26px; y: 178px; }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .hero-sub {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #00F0FF;
    }
    .hero-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      fill: #94A3B8;
    }
    .eq-bar {
      animation: barPulse 1.2s ease-in-out infinite alternate;
    }
    .status-dot {
      animation: dotBlink 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="236" rx="18" fill="url(#bg)" />
  <rect x="2" y="2" width="796" height="236" rx="18" fill="url(#dotGrid)" />
  <rect x="2" y="2" width="796" height="236" rx="18" fill="none" stroke="url(#borderAnim)" stroke-width="2" filter="url(#neon)" />

  <!-- Status Bar Top -->
  <g transform="translate(24, 28)">
    <circle cx="10" cy="0" r="4" fill="#00FF9D" class="status-dot" />
    <text x="24" y="4" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00FF9D" letter-spacing="1">SYSTEM: ONLINE</text>
    <text x="750" y="4" text-anchor="end" font-family="'SF Mono', monospace" font-size="11" fill="#64748B" letter-spacing="1">VOICE AI • FINTECH QUANT • FULL-STACK</text>
    <line x1="10" y1="16" x2="750" y2="16" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Centered Hero Typography -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <text y="0" class="hero-title" fill="url(#titleGrad)">ABHISHEK</text>
    <text y="32" class="hero-sub">FULL-STACK &amp; AI SYSTEMS ARCHITECT</text>
    <text y="58" class="hero-tag">Real-Time Voice AI (Groq + Deepgram) • FinTech Quant Systems • React &amp; Python</text>
  </g>

  <!-- Centered Waveform Equalizer -->
  <g transform="translate(280, 0)">
    <rect class="eq-bar" x="0" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.1s;" />
    <rect class="eq-bar" x="12" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.3s;" />
    <rect class="eq-bar" x="24" width="5" rx="2.5" fill="#38BDF8" style="animation-delay: 0.5s;" />
    <rect class="eq-bar" x="36" width="5" rx="2.5" fill="#38BDF8" style="animation-delay: 0.2s;" />
    <rect class="eq-bar" x="48" width="5" rx="2.5" fill="#818CF8" style="animation-delay: 0.6s;" />
    <rect class="eq-bar" x="60" width="5" rx="2.5" fill="#818CF8" style="animation-delay: 0.4s;" />
    <rect class="eq-bar" x="72" width="5" rx="2.5" fill="#A855F7" style="animation-delay: 0.7s;" />
    <rect class="eq-bar" x="84" width="5" rx="2.5" fill="#A855F7" style="animation-delay: 0.15s;" />
    <rect class="eq-bar" x="96" width="5" rx="2.5" fill="#C084FC" style="animation-delay: 0.8s;" />
    <rect class="eq-bar" x="108" width="5" rx="2.5" fill="#C084FC" style="animation-delay: 0.35s;" />
    <rect class="eq-bar" x="120" width="5" rx="2.5" fill="#EC4899" style="animation-delay: 0.65s;" />
    <rect class="eq-bar" x="132" width="5" rx="2.5" fill="#EC4899" style="animation-delay: 0.25s;" />
    <rect class="eq-bar" x="144" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.75s;" />
    <rect class="eq-bar" x="156" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.45s;" />
    <rect class="eq-bar" x="168" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.1s;" />
    <rect class="eq-bar" x="180" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.55s;" />
    <rect class="eq-bar" x="192" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.3s;" />
    <rect class="eq-bar" x="204" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.8s;" />
    <rect class="eq-bar" x="216" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.2s;" />
    <rect class="eq-bar" x="228" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.5s;" />
    <line x1="-10" y1="206" x2="245" y2="206" stroke="#334155" stroke-width="1.2" />
  </g>
</svg>