<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#7928CA;#FF007A;#00FF9D;#00F0FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#FF007A;#00FF9D;#00F0FF;#7928CA" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#00F0FF;#7928CA;#FF007A;#00FF9D" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.35" />
      <circle cx="30" cy="0" r="1" fill="#00F0FF" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #00FF9D); }
    }
    @keyframes waveBar {
      0%, 100% { height: 6px; y: 228px; opacity: 0.4; }
      50% { height: 34px; y: 200px; opacity: 1; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(8px); }
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      font-size: 38px;
    }
    .hud-sub {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-weight: 600;
      letter-spacing: 2.5px;
      font-size: 13px;
      fill: #38BDF8;
    }
    .hud-meta {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #64748B;
    }
    .pulse-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 40px 38px;
    }
    .bar {
      animation: waveBar 1.4s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="90" fill="#7928CA" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="180" r="110" fill="#00F0FF" opacity="0.10" filter="url(#glow)" />

  <!-- Neon Glowing Animated Border -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" filter="url(#subtleGlow)" />

  <!-- Corner Tech Accent Brackets -->
  <path d="M 24 16 L 14 16 L 14 26" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <path d="M 876 16 L 886 16 L 886 26" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <path d="M 24 264 L 14 264 L 14 254" fill="none" stroke="#00FF9D" stroke-width="2.5" />
  <path d="M 876 264 L 886 264 L 886 254" fill="none" stroke="#00FF9D" stroke-width="2.5" />

  <!-- Top Status HUD Bar -->
  <g transform="translate(24, 26)">
    <!-- Blinking Status Dot -->
    <circle cx="16" cy="12" r="5" fill="#00FF9D" class="pulse-dot" />
    <text x="32" y="16" class="hud-meta"><tspan fill="#00FF9D">SYSTEM: ONLINE</tspan> // CORE: ARCHITECT // STATUS: READY FOR HIRE</text>
    <text x="850" y="16" text-anchor="end" class="hud-meta">LATENCY: &lt;120ms • QUANT: ACTIVE • VOICE: READY</text>
    <line x1="16" y1="28" x2="850" y2="28" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(48, 115)">
    <!-- Name with Gradient -->
    <text x="0" y="0" class="hud-title" fill="url(#textGrad)">ABHISHEK</text>
    
    <!-- Tagline Badge -->
    <rect x="280" y="-32" width="170" height="26" rx="13" fill="#0E1726" stroke="#00F0FF" stroke-width="1" opacity="0.9" />
    <text x="365" y="-15" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">v2.4 // PRODUCTION</text>

    <!-- Subtitle -->
    <text x="2" y="34" class="hud-sub">FULL-STACK &amp; AI SYSTEMS ENGINEER</text>
    <text x="2" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94A3B8">
      Real-Time Voice AI (Groq + Deepgram) • FinTech Quant Engines (CCXT) • Cross-Platform Web &amp; Mobile
    </text>
  </g>

  <!-- Real-Time Audio / Quant Waveform Equalizer (Voice AI & FinTech Telemetry) -->
  <g transform="translate(560, 0)">
    <!-- Equalizer Label -->
    <text x="140" y="190" text-anchor="middle" class="hud-meta" fill="#38BDF8">VOICE &amp; QUANT SIGNAL PIPELINE</text>
    
    <!-- 16 Waveform Bars with Progressive Heights and Delays -->
    <rect class="bar" x="40" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.05s;" />
    <rect class="bar" x="52" width="5" rx="2.5" fill="#00F0FF" style="animation-delay: 0.25s;" />
    <rect class="bar" x="64" width="5" rx="2.5" fill="#38BDF8" style="animation-delay: 0.45s;" />
    <rect class="bar" x="76" width="5" rx="2.5" fill="#38BDF8" style="animation-delay: 0.15s;" />
    <rect class="bar" x="88" width="5" rx="2.5" fill="#818CF8" style="animation-delay: 0.60s;" />
    <rect class="bar" x="100" width="5" rx="2.5" fill="#818CF8" style="animation-delay: 0.35s;" />
    <rect class="bar" x="112" width="5" rx="2.5" fill="#A855F7" style="animation-delay: 0.70s;" />
    <rect class="bar" x="124" width="5" rx="2.5" fill="#A855F7" style="animation-delay: 0.20s;" />
    <rect class="bar" x="136" width="5" rx="2.5" fill="#C084FC" style="animation-delay: 0.80s;" />
    <rect class="bar" x="148" width="5" rx="2.5" fill="#C084FC" style="animation-delay: 0.40s;" />
    <rect class="bar" x="160" width="5" rx="2.5" fill="#E879F9" style="animation-delay: 0.10s;" />
    <rect class="bar" x="172" width="5" rx="2.5" fill="#E879F9" style="animation-delay: 0.65s;" />
    <rect class="bar" x="184" width="5" rx="2.5" fill="#F472B6" style="animation-delay: 0.30s;" />
    <rect class="bar" x="196" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.50s;" />
    <rect class="bar" x="208" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.85s;" />
    <rect class="bar" x="220" width="5" rx="2.5" fill="#00FF9D" style="animation-delay: 0.15s;" />

    <!-- Baseline Indicator Line -->
    <line x1="30" y1="234" x2="235" y2="234" stroke="#334155" stroke-width="1.5" />
    <circle cx="235" cy="234" r="2.5" fill="#00FF9D" />
  </g>

  <!-- Bottom Tech Ticker -->
  <g transform="translate(48, 256)">
    <circle cx="6" cy="-4" r="3" fill="#00F0FF" />
    <text x="18" y="0" font-family="'SF Mono', monospace" font-size="11" fill="#64748B">
      <tspan fill="#38BDF8">DEEPGRAM</tspan> • <tspan fill="#F55036">GROQ LPU</tspan> • <tspan fill="#61DAFB">REACT</tspan> • <tspan fill="#3776AB">PYTHON</tspan> • <tspan fill="#F0B90B">CCXT</tspan> • <tspan fill="#009688">QUART ASGI</tspan> • <tspan fill="#38B2AC">TAILWIND</tspan>
    </text>
  </g>
</svg>