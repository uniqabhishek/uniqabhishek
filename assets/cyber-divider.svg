<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1" />
      <stop offset="65%" stop-color="#00FF9D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDiamond {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00F0FF); }
      50% { transform: scale(1.3); filter: drop-shadow(0 0 8px #A855F7); }
    }
    @keyframes sweepDot {
      0% { cx: 200; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 700; opacity: 0; }
    }
    .center-diamond {
      animation: pulseDiamond 2.5s ease-in-out infinite;
      transform-origin: 450px 12px;
    }
    .data-packet {
      animation: sweepDot 3s ease-in-out infinite;
    }
  </style>

  <!-- Glowing Axis Line -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#divGrad)" stroke-width="1.8" filter="url(#divGlow)" />

  <!-- Sweeping Data Packet -->
  <circle cy="12" r="3" fill="#00FF9D" class="data-packet" filter="url(#divGlow)" />

  <!-- Central Diamond Hex Node -->
  <polygon points="450,4 458,12 450,20 442,12" fill="#0E1726" stroke="#00F0FF" stroke-width="1.5" class="center-diamond" />
  <circle cx="450" cy="12" r="2" fill="#00FF9D" />

  <!-- Flanking Accent Notches -->
  <circle cx="410" cy="12" r="2" fill="#A855F7" opacity="0.8" />
  <circle cx="490" cy="12" r="2" fill="#A855F7" opacity="0.8" />
  <circle cx="370" cy="12" r="1.5" fill="#00F0FF" opacity="0.6" />
  <circle cx="530" cy="12" r="1.5" fill="#00FF9D" opacity="0.6" />
</svg>